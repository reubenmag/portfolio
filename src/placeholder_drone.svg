<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <rect width="600" height="200" fill="#090f25"/>
  <!-- Background grid -->
  <defs>
    <pattern id="scanGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0,246,255,0.07)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="600" height="200" fill="url(#scanGrid)"/>
  <!-- Scan sweep line -->
  <rect x="0" y="92" width="600" height="1.5" fill="rgba(0,246,255,0.35)"/>
  <rect x="0" y="88" width="600" height="9" fill="rgba(0,246,255,0.05)"/>
  <!-- Detection zones -->
  <rect x="80"  y="60"  width="100" height="70" rx="4" fill="none" stroke="rgba(0,246,255,0.2)" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="420" y="55"  width="100" height="80" rx="4" fill="none" stroke="rgba(0,246,255,0.2)" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- Main target - detected pipeline -->
  <rect x="220" y="72" width="160" height="48" rx="6" fill="rgba(0,246,255,0.08)" stroke="rgba(0,246,255,0.7)" stroke-width="1.5"/>
  <!-- Crosshair corners -->
  <path d="M220,72 L235,72 M220,72 L220,87" stroke="#00f6ff" stroke-width="2" fill="none"/>
  <path d="M380,72 L365,72 M380,72 L380,87" stroke="#00f6ff" stroke-width="2" fill="none"/>
  <path d="M220,120 L235,120 M220,120 L220,105" stroke="#00f6ff" stroke-width="2" fill="none"/>
  <path d="M380,120 L365,120 M380,120 L380,105" stroke="#00f6ff" stroke-width="2" fill="none"/>
  <!-- Pipeline representation (horizontal bars) -->
  <rect x="240" y="82" width="120" height="8"  rx="4" fill="rgba(59,228,198,0.6)"/>
  <rect x="240" y="96" width="120" height="8"  rx="4" fill="rgba(59,228,198,0.4)"/>
  <rect x="240" y="110" width="120" height="6" rx="3" fill="rgba(59,228,198,0.25)"/>
  <!-- F1 score badge -->
  <rect x="434" y="18" width="130" height="26" rx="5" fill="rgba(0,246,255,0.12)" stroke="rgba(0,246,255,0.5)" stroke-width="1"/>
  <text x="499" y="35" font-family="monospace" font-size="12" fill="#00f6ff" text-anchor="middle" font-weight="bold">F1 : 99.96 %</text>
  <!-- Drone markers (corners) -->
  <circle cx="50"  cy="35"  r="4" fill="rgba(59,228,198,0.6)"/>
  <circle cx="550" cy="35"  r="4" fill="rgba(59,228,198,0.6)"/>
  <circle cx="50"  cy="165" r="4" fill="rgba(59,228,198,0.6)"/>
  <circle cx="550" cy="165" r="4" fill="rgba(59,228,198,0.6)"/>
  <!-- Label -->
  <text x="300" y="192" font-family="monospace" font-size="11" fill="rgba(0,246,255,0.45)" text-anchor="middle" letter-spacing="2">COMPUTER VISION · DRONE DATA · PIPELINE DETECTION</text>
</svg>
